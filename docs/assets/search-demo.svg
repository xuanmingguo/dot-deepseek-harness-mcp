<text x="98" y="651" fill="#14213d" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="700">核对命中行的原文</text>
<text x="98" y="696" fill="#536581" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400">SHA-256 与本次搜索一致</text>
<rect x="552" y="198" width="816" height="610" rx="22" fill="#ffffff"/>
<text x="584" y="247" fill="#4255d5" font-family="DejaVu Sans Mono,ui-monospace,monospace" font-size="23" font-weight="700">SEARCH → VERIFIED READ</text>
