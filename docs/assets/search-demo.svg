<text x="584" y="744" fill="#536581" font-family="DejaVu Sans Mono,ui-monospace,monospace" font-size="22" font-weight="400">c1db82ac9c7e47c952d938a0258d99b3</text>
<text x="72" y="858" fill="#b5c3df" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400">真实返回的可视化整理，非原始聊天截图；文件为公开演示数据。</text>
