name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/setup@v3.1.1
        with:
          version: 12.11.2
          runtime: node@22.23.1
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:privacy
      - run: pnpm run check:public
      - run: pnpm run prepack
      - run: pnpm test
      - run: python3 scripts/scan-source-secrets.py
      - run: pnpm run test:package
      - name: Scan complete history and built files with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$audit_dir/gitleaks.tgz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$audit_dir/gitleaks.tgz" | sha256sum --check
          tar --extract --gzip --file "$audit_dir/gitleaks.tgz" --directory "$audit_dir" gitleaks
          "$audit_dir/gitleaks" git . --redact=100 --no-banner --ignore-gitleaks-allow --log-opts=--all --max-decode-depth=3
          "$audit_dir/gitleaks" dir dist --redact=100 --no-banner --ignore-gitleaks-allow --max-decode-depth=3
